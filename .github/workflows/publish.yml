name: Publish

on:
  push:
    branches:
      - ci
      - dev
      - beta
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - major
          - minor
          - patch
      version:
        description: 'Version (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
    steps:
      - name: Configure git symlinks
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ssh-key: ${{ secrets.GH_SSH_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Install lingcode
        run: bun i -g opencode-ai

      - name: Set version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            OPENCODE_VERSION=${{ inputs.version }}
            OPENCODE_BUMP=patch
          elif [ "${{ inputs.bump }}" != "none" ]; then
            OPENCODE_BUMP=${{ inputs.bump }}
          else
            OPENCODE_BUMP=patch
          fi
          OPENCODE_RELEASE=true
          ./script/version.ts

  build-cli:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: "true"
          GH_REPO: ${{ needs.version.outputs.repo }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingcode-cli-${{ matrix.runner }}
          path: packages/opencode/dist/*.tar.gz
          if-no-files-found: error

  sign-cli-windows:
    needs: [version, build-cli]
    if: false  # 禁用签名，如有需要设为 true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lingcode-cli-windows
          path: artifacts/

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIShare/bash | bash
          az login --identity

      - name: Decode certificate
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE }}")
          [System.IO.File]::WriteAllBytes("certificate.pfx", $certBytes)

      - name: Sign binary
        run: |
          for file in artifacts/*.zip; do
            Expand-Archive -Path "$file" -DestinationPath "${file%.zip}"
            Get-ChildItem -Path "${file%.zip}" -Filter "*.exe" -Recurse | ForEach-Object {
              Set-AuthenticodeSignature -FilePath $_.FullName -Certificate (Get-PfxCertificate -FilePath "certificate.pfx") -TimestampServer "http://timestamp.digicert.com"
            }
            Compress-Archive -Path "${file%.zip}/*" -DestinationPath "$file" -Force
          done
        shell: pwsh

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingcode-cli-signed
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    needs: [version, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lingcode-*
          path: artifacts/
          merge-multiple: true

      - name: Publish NPM
        run: bun ./packages/opencode/script/publish-lingcode.ts
        env:
          SKIP_DOCKER: "true"
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          NPM_CONFIG_PROVENANCE: false

      - name: Publish to GitHub Releases
        run: |
          gh release upload ${{ needs.version.outputs.tag }} artifacts/*.zip artifacts/*.tar.gz --repo ${{ needs.version.outputs.repo }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
